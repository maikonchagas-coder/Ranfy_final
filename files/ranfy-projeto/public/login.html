<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07143f">
  <title>Ranfy — Sua opinião faz a diferença</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page page-login">
  <main class="login-shell">
    <a class="brand brand-image" href="login.html" aria-label="SENAI"><img src="assets/senai.png" alt="SENAI"></a>
    <section class="login-content" aria-labelledby="page-title">
      <span class="eyebrow"><span class="eyebrow-dot"></span> JOGADOR 1</span>
      <h1 id="page-title">Sua opinião<br>faz a <span class="text-accent">diferença.</span></h1>
      <form id="login-form" class="login-form" style="display:grid;gap:10px">
        <label for="participant-name">Como podemos chamar você?</label>
        <input id="participant-name" name="nome" type="text" placeholder="Digite seu nome" autocomplete="name" required maxlength="80">
        <button class="button button-primary button-wide" type="submit">Começar <span class="button-arrow" aria-hidden="true">▶</span></button>
      </form>
      <p class="lead">Avalie os projetos que estão transformando ideias em inovação no Mundo SENAI.</p>
    </section>
  </main>
  <aside class="pixel-decoration" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></aside>
  <script src="js/login.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
